version = 1

# Files without an SPDX header take the licence below; files with a header keep theirs.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Iain Chesworth Labs contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The two bundled fonts keep their own licence and copyright, so these override the default above.
[[annotations]]
path = ["apps/game/fonts/Bangers-Regular.ttf", "apps/game/fonts/Bangers-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2010 The Bangers Project Authors (https://github.com/googlefonts/bangers)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["apps/game/fonts/LilitaOne-Regular.ttf", "apps/game/fonts/LilitaOne-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2011 Juan Montoreano (juan@remolacha.biz), with Reserved Font Names \"Lilita One\""
SPDX-License-Identifier = "OFL-1.1"
