name: CodeQL

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions: {}

# What the cpp analysis sees: the linux-release preset builds libs/core, apps/game and every test, with Qt of the version
# in .github/toolchain-versions.json, so all of that is analysed. It does not see what that build leaves out: the Qt
# Multimedia sound backend (the reusable workflow installs Qt with no add-on modules, so the silent backend is built
# instead), and the Windows, macOS, iOS, Android and browser files under apps/game/src/platform. MSVC /analyze in
# nightly.yml covers the Windows files. Alerts go to code scanning; the job itself fails only when the build or the
# analysis does.
jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      contents: read
      issues: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/codeql.yml@7298129e789aab3e34c523aace5c699dc24e0001 # v0.1.25
    with:
      runner: '["ubuntu-26.04"]'
      languages: >-
        [
          {"language": "cpp", "build_mode": "manual", "preset": "linux-release", "vcpkg": true},
          {"language": "python", "build_mode": "none"},
          {"language": "actions", "build_mode": "none"}
        ]
